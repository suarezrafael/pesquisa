name: CI

# lab-101, G10 (docs/prompts/05-escala-e-viabilidade.md): até aqui os 88 testes deste repositório
# (39 do jogo + 36 do Worker de contas + 13 do relay) só rodavam se alguém lembrasse de rodar na
# mão. Três jobs independentes porque são três packages sem workspace de monorepo (cada um com seu
# próprio package.json/node_modules) — não dá pra instalar tudo de uma vez com um `npm ci` só.
on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # `npm run build` (tsc -b + vite build) em vez de só `tsc -b` — é o mesmo comando que
      # `vercel --prod` roda de verdade antes de publicar; falha aqui pega o mesmo erro mais cedo.
      # Não precisa de nenhum secret novo: `.env`/`.env.production` já estão versionados (só URLs
      # públicas, conferido antes de escrever este workflow).
      - run: npm run build
      - run: npm run test

  server-accounts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/server-accounts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/server-accounts/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test

  server-cf-relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/server-cf-relay
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/server-cf-relay/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test
