name = "missao-aprender-accounts"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

# lab-102, resto de G8: reconciliação Stripe↔banco — primeiro Cron Trigger deste projeto. Diário é
# suficiente (a reconciliação corrige drift, não previne em tempo real; os webhooks continuam
# sendo o caminho principal, isto é uma rede de segurança). 09:00 UTC = 06:00 em São Paulo, fora do
# horário de pico de uso do jogo.
# lab-119, Fase F: segunda entrada — relatório semanal de progresso por e-mail, segunda-feira
# 12:00 UTC (09:00 em São Paulo). `scheduled()` (`index.ts`) decide qual das duas tarefas rodar
# comparando `controller.cron` contra `WEEKLY_EMAIL_CRON` — as duas strings têm que bater
# exatamente se este valor mudar.
[triggers]
crons = ["0 9 * * *", "0 12 * * 1"]

[vars]
# ID do Price recorrente (R$ 4,99/mês) no Stripe, modo teste — não é secreto, é só um
# identificador público do catálogo de produtos.
STRIPE_PRICE_ID = "price_1U7k0BDLQrb3UkMn0MFvRcVf"

# DATABASE_URL, STRIPE_SECRET_KEY e STRIPE_WEBHOOK_SECRET são secrets, não vars comuns — nunca
# comitados. Local: app/server-accounts/.dev.vars (gitignored). Produção: `wrangler secret put <NOME>`.

# Rate limiting nativo do Workers (lab-88, pedido do usuário: "o jogo precisa estar seguro com
# sobrecarga de servidor") — binding disponível no plano Free (confirmado com um deploy real
# antes de desenhar a correção, não estava documentado com clareza nas páginas de preço da
# Cloudflare). Cada rota sensível tem seu próprio namespace — um IP estourando o limite de
# `/pairing/redeem` não afeta a cota de `/checkout`, por exemplo. `namespace_id` só precisa ser
# único dentro desta conta/Worker; os números abaixo não têm significado especial.
[[ratelimits]]
name = "PAIRING_REDEEM_LIMITER"
namespace_id = "1001"
  # Achado crítico da auditoria: sem isso, um único script guessava as ~900.000 combinações do
  # código de 6 dígitos dentro da janela de validade de 15 min (900.000 códigos / 900s = só
  # 1.000 tentativas/s, trivial). 8 tentativas/min por IP deixa margem generosa pra erro de
  # digitação de uma criança, mas reduz o espaço de busca prático em várias ordens de grandeza.
  [ratelimits.simple]
  limit = 8
  period = 60

[[ratelimits]]
name = "HEALTH_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "CLIENT_ERROR_LIMITER"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "CHECKOUT_LIMITER"
namespace_id = "1004"
  # Autenticado (exige JWT válido), então o limite pode ser mais folgado que as rotas públicas —
  # é só pra evitar abuso de uma conta comprometida/mal-intencionada, não o vetor principal.
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "PAIRING_GENERATE_LIMITER"
namespace_id = "1005"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "EVENTS_LIMITER"
namespace_id = "1006"
  # lab-99, resto de G11 — endpoint anônimo e público como `/client-error`, mesmo limite: alto o
  # bastante pra uma sessão de jogo real nunca esbarrar nele (poucos eventos por sessão:
  # session_start, quest_completed ocasional, session_end), baixo o bastante pra não virar um
  # vetor barato de encher `product_events` de lixo.
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "NPS_LIMITER"
namespace_id = "1007"
  # lab-103: autenticado (exige JWT do responsável) e de baixa frequência por natureza (o widget
  # só aparece a cada NPS_COOLDOWN_DAYS) — limite baixo o bastante pra não servir de vetor de
  # spam em `nps_responses`, alto o bastante pra nunca incomodar um uso real.
  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "PROGRESS_SUMMARY_LIMITER"
namespace_id = "1008"
  # lab-119, Fase F: autenticado (exige o token de entitlement) e disparado no máximo uma vez por
  # sessão de jogo real (`syncProgressSummary`, `app/src/state/useEntitlement.ts`) — mesmo espírito
  # do `EVENTS_LIMITER`, alto o bastante pra nunca esbarrar em uso real, baixo o bastante pra não
  # virar vetor de encher `progress_snapshots` de escritas.
  [ratelimits.simple]
  limit = 10
  period = 60
