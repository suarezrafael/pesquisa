name = "missao-aprender-relay-v2"
main = "src/index.ts"
compatibility_date = "2026-08-19"

# Durable Object com storage SQLite (`new_sqlite_classes`, não `new_classes`) — é o único tipo de
# Durable Object disponível no plano Free do Workers (o clássico, sem SQLite, exige plano pago).
# Este relay não guarda nada em storage (é só um broadcast em memória via WebSocket Hibernation
# API), mas o *tipo* do Durable Object precisa ser SQLite-backed pra poder rodar no Free.
[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

# Rate limiting nativo do Workers (lab-88, pedido do usuário: "o jogo precisa estar seguro com
# sobrecarga de servidor") — limita NOVAS conexões WebSocket por IP, antes mesmo do upgrade.
# Achado da auditoria: o relay aceitava qualquer conexão sem limite nenhum; como é uma sala
# global única (um Durable Object só pra todo mundo), inundar com conexões degradava o jogo pra
# TODOS os jogadores reais ao mesmo tempo, não só pro atacante.
[[ratelimits]]
name = "CONNECTION_LIMITER"
namespace_id = "2001"
  [ratelimits.simple]
  limit = 20
  period = 60
